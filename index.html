<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculadora Inteligente</title>

  <style>
    body{
      font-family: Arial, Helvetica, sans-serif;
      background: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .calc{
      background: #2d2d2d;
      padding: 25px;
      border-radius: 15px;
      width: 350px;
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
    }

    h1{
      color: white;
      text-align: center;
      margin-bottom: 20px;
    }

    input{
      width: 100%;
      padding: 15px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      outline: none;
      margin-bottom: 15px;
      box-sizing: border-box;
    }

    button{
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #00b894;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover{
      background: #019875;
    }

    .resultado{
      margin-top: 20px;
      background: #111;
      color: #00ff99;
      padding: 15px;
      border-radius: 10px;
      font-size: 20px;
      min-height: 30px;
      word-wrap: break-word;
    }

    .exemplo{
      color: #bbb;
      font-size: 14px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div class="calc">
    <h1>Calculadora Inteligente</h1>

    <div class="exemplo">
      Exemplo: (5 + 7) * 2 - 10 / 5
    </div>

    <input 
      type="text" 
      id="conta" 
      placeholder="Digite sua conta matemática"
    >

    <button onclick="calcular()">
      Calcular
    </button>

    <div class="resultado" id="resultado">
      Resultado aparecerá aqui
    </div>
  </div>

  <script>
    function calcular() {

      const conta = document.getElementById("conta").value;
      const resultado = document.getElementById("resultado");

      try {

        // Verifica tamanho mínimo
        if(conta.length < 9){
          resultado.innerHTML = "A expressão deve ter no mínimo 9 caracteres.";
          return;
        }

        // Faz o cálculo
        const resposta = eval(conta);

        resultado.innerHTML = `
          Conta: ${conta}<br>
          Resultado: ${resposta}
        `;

      } catch (erro) {

        resultado.innerHTML = "Expressão inválida.";

      }
    }
  </script>

</body>
</html>
